[project]
name = "fedcxr"
version = "1.0.0"
description = "Heterogeneidade de dados e custo de comunicação no Aprendizado Federado em radiografias de tórax"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"

[tool.setuptools]
packages = ["fedcxr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["notebooks"]  # células com comandos de shell do Colab (!git, !pip)

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B905"]  # zip sem strict: os comprimentos são iguais por construção

[tool.ruff.lint.isort]
known-first-party = ["fedcxr", "scripts"]
